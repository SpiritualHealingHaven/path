<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="titleDesc">
  <title id="titleDesc">Spiritual healing illustration</title>
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0" stop-color="#FDF7F0"/>
      <stop offset="1" stop-color="#F6E8D6"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" x2="1">
      <stop offset="0" stop-color="#B22222"/>
      <stop offset="1" stop-color="#8B1E1E"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#g1)" rx="20"/>
  <!-- gentle sun -->
  <circle cx="140" cy="120" r="80" fill="url(#g2)" opacity="0.12" />
  <!-- lotus petals -->
  <g transform="translate(400,300) scale(1.1)">
    <path d="M0,-120 C40,-80 80,-80 110,-20 C70,-10 40,10 0,90 C-40,10 -70,-10 -110,-20 C-80,-80 -40,-80 0,-120 Z" fill="#FDE9D9" opacity="0.95"/>
    <path d="M0,-90 C28,-60 55,-60 80,-15 C50,-8 28,8 0,70 C-28,8 -50,-8 -80,-15 C-55,-60 -28,-60 0,-90 Z" fill="#FFDAB3" opacity="0.95"/>
    <ellipse cx="0" cy="22" rx="80" ry="28" fill="#FFF5EA"/>
  </g>
  <!-- hands simplified -->
  <g transform="translate(400,360)">
    <path d="M-140,40 C-100,10 -60,-10 -20,-8 C10,-6 40,4 80,22" stroke="#2D2D2D" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.85"/>
    <path d="M140,40 C100,10 60,-10 20,-8 C-10,-6 -40,4 -80,22" stroke="#2D2D2D" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.85"/>
  </g>
  <!-- subtle decorative dots -->
  <g fill="#D4AF37" opacity="0.9">
    <circle cx="520" cy="80" r="3"/>
    <circle cx="560" cy="110" r="2.2"/>
    <circle cx="480" cy="150" r="2.6"/>
  </g>
</svg>